<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- CSP：内联 style + script，唯一外部资源是同源的 vendor/morphicons（锁图标形变），无网络请求、无图片 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'">
  <title>Mineradio Desktop Lyrics</title>
  <style>
    :root{
      --lyric-primary:#f6fdff;
      --lyric-secondary:#a8f6ff;
      --lyric-highlight:#fff0b8;
      --lyric-glow:#9cffdf;
      --lyric-font:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;
      --lyric-weight:900;
      --lyric-letter-spacing:0px;
      --lyric-line-height:1;
      --lyric-size:58px;
      --lyric-progress:0%;
      --lyric-feather:5.5%;
      --lyric-fit-x:1;
      --lyric-scroll-x:0px;
      --lyric-edge-width:92px;
      --lyric-mask-edge-width:92px;
      --lyric-vertical-feather:46px;
      --lyric-css-beat-glow:0px;
      --lyric-shadow-soft:rgba(156,255,223,.34);
      --lyric-shadow-glow:rgba(156,255,223,.26);
      --lyric-shadow-hot:rgba(255,240,184,.22);
      --lyric-edge:rgba(4,6,12,.42);
      --lyric-drop:rgba(156,255,223,.38);
      --lyric-drop-paused:rgba(156,255,223,.22);
    }
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;user-select:none}
    body{opacity:0;transition:opacity .22s ease;-webkit-app-region:no-drag}
    body.show{opacity:1}
    canvas{display:none}
    .wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 12px;pointer-events:none}
    .stage{
      position:relative;
      max-width:calc(100vw - 24px);
      padding:104px 86px 94px;
      box-sizing:border-box;
      pointer-events:auto;
      cursor:default;
      transform-style:preserve-3d;
      transform-origin:center;
      will-change:transform,filter;
      contain:layout style;
      backface-visibility:hidden;
      -webkit-app-region:no-drag;
    }
    body.unlocked .stage{cursor:move}
    body.unlocked .stage.hint-visible{cursor:move;-webkit-app-region:no-drag}
    .lyric-viewport{
      position:relative;
      z-index:2;
      display:block;
      width:min(100%,1120px);
      max-width:calc(100vw - 24px);
      margin:0 auto;
      padding:1.24em var(--lyric-edge-width) 1.34em;
      box-sizing:border-box;
      overflow:hidden;
      text-align:center;
      pointer-events:none;
      isolation:isolate;
      -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--lyric-mask-edge-width),#000 calc(100% - var(--lyric-mask-edge-width)),transparent 100%);
      mask-image:linear-gradient(90deg,transparent 0,#000 var(--lyric-mask-edge-width),#000 calc(100% - var(--lyric-mask-edge-width)),transparent 100%);
      filter:drop-shadow(0 1px 2.4px rgba(4,6,12,.58)) drop-shadow(0 0 4.8px rgba(4,6,12,.30));
      transform:translateZ(0);
      will-change:transform,filter;
    }
    body.unlocked .stage.hint-visible .lyric-viewport{pointer-events:auto;cursor:move;-webkit-app-region:no-drag}
    .lyric-scroll{
      display:inline-block;
      /* 倾斜 = 绕 Y 轴的三维旋转（perspective 让远近有透视），不是画面内旋转。
         多行时这段容器 display:none，旋转交给 .lyric-stack，不会转两次。 */
      transform:perspective(800px) rotateY(var(--lyric-tilt, 0deg)) translate3d(var(--lyric-scroll-x),0,0) scaleX(var(--lyric-fit-x));
      transform-origin:center;
      will-change:transform;
      backface-visibility:hidden;
    }
    .line{
      position:relative;
      z-index:2;
      display:inline-block;
      max-width:none;
      color:#fff;
      font-family:var(--lyric-font);
      font-size:var(--lyric-size);
      font-weight:var(--lyric-weight);
      line-height:var(--lyric-line-height);
      letter-spacing:var(--lyric-letter-spacing);
      text-align:center;
      white-space:nowrap;
      overflow:visible;
      text-overflow:clip;
      padding:.20em .12em .34em;
      margin:-.20em -.12em -.34em;
      background:linear-gradient(90deg,var(--lyric-primary),var(--lyric-primary));
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      -webkit-text-stroke:.18px rgba(255,255,255,.72);
      paint-order:stroke fill;
      text-shadow:0 0 1px rgba(255,255,255,.34),0 0 calc(6px + var(--lyric-css-beat-glow)) var(--lyric-shadow-soft),0 0 calc(14px + var(--lyric-css-beat-glow)) var(--lyric-shadow-glow);
      filter:none;
      opacity:0;
      transform:translate3d(0,0,0);
      transform-origin:center;
      backface-visibility:hidden;
      will-change:opacity,filter,transform,background;
    }
    body.highlight .line{
      background:linear-gradient(90deg,
        var(--lyric-highlight) 0%,
        var(--lyric-highlight) max(0%,calc(var(--lyric-progress) - var(--lyric-feather))),
        var(--lyric-glow) calc(var(--lyric-progress) + 1.2%),
        var(--lyric-primary) calc(var(--lyric-progress) + var(--lyric-feather)),
        var(--lyric-primary) 100%);
      -webkit-background-clip:text;
      background-clip:text;
    }
    .line.in{animation:lyr-in 820ms cubic-bezier(.16,.84,.32,1.02) forwards}
    /* ---- 单行模式的换行动效 ----
       以前单行（默认行数 1）换行只播上面那条固定的 lyr-in，四种「换行动效」看起来
       完全一样 —— 面板上选什么都没反应。这里按 body.motion-* 分支出不同入场，
       和多行栈（.line-row）用同一套语义：上浮 / 3D 翻转 / 呼吸 / 静止。 */
    @keyframes lyr-motion-slide{
      0%{opacity:0;transform:translate3d(0,34px,0) scale(.92);filter:blur(8px)}
      58%{opacity:1;filter:blur(0)}
      100%{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}
    }
    @keyframes lyr-motion-flip{
      0%{opacity:0;transform:perspective(620px) rotateX(-74deg) translate3d(0,10px,0);filter:blur(4px)}
      58%{opacity:1;filter:blur(0)}
      100%{opacity:1;transform:perspective(620px) rotateX(0deg) translate3d(0,0,0);filter:blur(0)}
    }
    @keyframes lyr-motion-breathe{
      0%,100%{transform:translate3d(0,0,0) scale(1)}
      /* 幅度不能太小：3px / 1.5% 在 58px 字号下肉眼不可见（实测「呼吸没有效果」） */
      50%{transform:translate3d(0,-8px,0) scale(1.04)}
    }
    /* 呼吸的「换行反馈」：入场短促弹一下，呼吸从入场结束接上。
       两个动画叠加在同一规则里；float-in 只 fill transform，opacity 交给 breathe 规则，
       否则 fill 的 opacity:1 会顶掉暂停时的 .84。 */
    @keyframes lyr-float-in{
      0%{transform:scale(.94)}
      100%{transform:scale(1)}
    }
    body.motion-slide .line.in{animation:lyr-motion-slide .60s cubic-bezier(.16,.84,.32,1) both}
    body.motion-flip .line.in{animation:lyr-motion-flip .66s cubic-bezier(.2,.82,.24,1) both}
    /* :not(.paused) —— 暂停时别继续呼吸，也别把 .paused 的 0.84 透明度顶掉 */
    body.motion-float:not(.paused) .line{opacity:1;animation:lyr-motion-breathe 4.6s ease-in-out infinite}
    body.motion-float:not(.paused) .line.in{animation:lyr-float-in .55s cubic-bezier(.2,.8,.24,1) both,lyr-motion-breathe 4.6s .55s ease-in-out infinite}
    body.motion-none .line.in{animation:none;opacity:1}
    body.paused .line{filter:none;opacity:.84}
    .line-next{
      display:block;
      margin-top:.18em;
      font-size:calc(var(--lyric-size) * 0.72);
      font-weight:calc(var(--lyric-weight) * 0.82);
      opacity:.48;
      filter:none;
      -webkit-text-stroke:.12px rgba(255,255,255,.42);
      text-shadow:0 0 1px rgba(255,255,255,.18),0 0 8px rgba(4,6,12,.24);
      background:linear-gradient(90deg,var(--lyric-secondary),var(--lyric-secondary));
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    body.highlight .line-next{
      background:linear-gradient(90deg,var(--lyric-secondary),var(--lyric-secondary));
      -webkit-background-clip:text;
      background-clip:text;
    }
    .line-next:empty{display:none}
    /* ---- 多行歌词栈（桌面歌词行数 > 1 时启用）-----------------------------
       参考「一段连续歌词压在画面上的效果」：当前句居中放大高亮，
       上下相邻句缩小变淡，整块可按设置倾斜，换行时只做位移动画。 */
    body.stack-mode .stage{padding:22px 42px 26px}
    body.stack-mode .lyric-viewport{
      padding:.18em var(--lyric-edge-width) .26em;
      overflow:visible;
      /* 多行整块会整体倾斜，行尾会越过 viewport 边缘；
         单行用的左右渐隐遮罩会把这些字直接裁掉，所以这里关掉遮罩。 */
      -webkit-mask-image:none;
      mask-image:none;
    }
    body.stack-mode .lyric-scroll{display:none}
    .lyric-stack{
      position:relative;
      z-index:3;
      display:none;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:var(--lyric-row-gap, 24px);
      width:100%;
      /* 绕 Y 轴旋转：左右两端一近一远，产生「整块被转过去一点」的三维感 */
      transform:perspective(800px) rotateY(var(--lyric-tilt, 0deg));
      transform-origin:center center;
      transition:transform .38s cubic-bezier(.22,.8,.24,1);
      pointer-events:none;
      will-change:transform;
    }
    body.stack-mode .lyric-stack{display:flex}
    .line-row{
      display:block;
      max-width:100%;
      color:#fff;
      font-family:var(--lyric-font);
      font-size:var(--lyric-row-size, 34px);
      font-weight:var(--lyric-weight);
      line-height:var(--lyric-row-line-height, 1.18);
      letter-spacing:var(--lyric-letter-spacing);
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:clip;
      background:linear-gradient(90deg,var(--lyric-primary),var(--lyric-primary));
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      -webkit-text-stroke:.12px rgba(255,255,255,.44);
      paint-order:stroke fill;
      text-shadow:0 0 1px rgba(255,255,255,.20),0 0 10px var(--lyric-shadow-glow);
      opacity:0;
      transform:translate3d(0,0,0);
      transform-origin:center center;
      transition:opacity .34s ease, transform .42s cubic-bezier(.2,.8,.2,1), font-size .34s ease;
      will-change:opacity,transform;
      backface-visibility:hidden;
    }
    .line-row.ghost{opacity:0}
    .line-row.past{opacity:.5}
    .line-row.future{opacity:.64}
    body.paused .line-row.past{opacity:.4}
    body.paused .line-row.future{opacity:.52}
    .line-row.active{
      opacity:1;
      background:linear-gradient(90deg,
        var(--lyric-highlight) 0%,
        var(--lyric-highlight) max(0%,calc(var(--row-progress, 0%) - 4%)),
        var(--lyric-glow) calc(var(--row-progress, 0%) + 1.2%),
        var(--lyric-primary) calc(var(--row-progress, 0%) + 5.5%),
        var(--lyric-primary) 100%);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-stroke:.2px rgba(255,255,255,.78);
      text-shadow:0 0 2px rgba(255,255,255,.34),0 0 calc(8px + var(--lyric-css-beat-glow)) var(--lyric-shadow-soft),0 0 calc(18px + var(--lyric-css-beat-glow)) var(--lyric-shadow-glow);
    }
    /* 注意：这里不能用 filter:blur() 做入场虚化。
       Chromium 下带 filter 的元素会丢失 background-clip:text 的裁切，
       当前句会整行画不出来（只剩阴影）。入场只用位移 / 透明度 / 3D 旋转。 */
    @keyframes row-slide{
      0%{opacity:0;transform:translate3d(0,26px,0)}
      100%{opacity:1;transform:translate3d(0,0,0)}
    }
    @keyframes row-flip{
      0%{opacity:0;transform:perspective(560px) rotateX(-72deg) translate3d(0,12px,0)}
      100%{opacity:1;transform:perspective(560px) rotateX(0deg) translate3d(0,0,0)}
    }
    @keyframes row-breathe{
      0%,100%{transform:translate3d(0,0,0) scale(1)}
      /* 幅度不能太小：3px / 1.5% 在 30px 左右的行字号下肉眼不可见（实测「呼吸没有效果」） */
      50%{transform:translate3d(0,-7px,0) scale(1.04)}
    }
    /* 呼吸的「换行反馈」：其他三档换行都有入场，「呼吸」换成短促弹一下 + 呼吸接续。
       叠在 .active.enter 上（特异性高于单 breathe），fill 只占 transform/opacity，
       暂停时整条规则不匹配（:not(.paused)），不会顶掉暂停态。 */
    @keyframes row-float-in{
      0%{opacity:.15;transform:scale(.94)}
      100%{opacity:1;transform:scale(1)}
    }
    body.motion-slide .line-row.enter{animation:row-slide .58s cubic-bezier(.16,.84,.32,1) both}
    body.motion-flip .line-row.enter{animation:row-flip .64s cubic-bezier(.2,.82,.24,1) both}
    body.motion-float:not(.paused) .line-row.active{animation:row-breathe 4.6s ease-in-out infinite}
    body.motion-float:not(.paused) .line-row.active.enter{animation:row-float-in .55s cubic-bezier(.2,.8,.24,1) both,row-breathe 4.6s .55s ease-in-out infinite}
    body.motion-none .line-row{transition:opacity .18s linear}
    .lock-hint{
      position:absolute;
      z-index:4;
      left:50%;
      top:72px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      min-width:92px;
      min-height:30px;
      padding:0 11px;
      border-radius:999px;
      border:1px solid color-mix(in srgb,var(--lyric-glow) 58%,rgba(255,255,255,.36));
      background:rgba(4,6,10,.44);
      color:rgba(255,255,255,.84);
      font:800 12px/1 "Microsoft YaHei",sans-serif;
      text-shadow:0 1px 10px rgba(0,0,0,.55);
      box-shadow:0 0 20px color-mix(in srgb,var(--lyric-glow) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.16);
      opacity:0;
      pointer-events:none;
      transform:translateX(-50%) translateY(-8px) scale(.92);
      transition:opacity .16s ease,transform .16s ease;
      -webkit-app-region:no-drag;
    }
    /* 锁图标：Lucide lock ↔ lock-open，由 morphicons 做形状形变（弹簧），
       不再用两段伪元素拼锁体/锁梁。24×24 网格，path 由脚本写入。 */
    .lock-icon{
      display:block;
      width:13px;
      height:13px;
      flex:0 0 auto;
      overflow:visible;
    }
    .lock-icon path{
      fill:none;
      stroke:var(--lyric-highlight);
      stroke-width:2.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .lyrics-close{
      display:none;
      align-items:center;
      justify-content:center;
      height:22px;
      width:auto;
      margin-right:-4px;
      border:0;
      border-left:1px solid rgba(255,255,255,.14);
      padding:0 0 1px 9px;
      background:transparent;
      color:rgba(255,255,255,.82);
      font:800 12px/1 "Microsoft YaHei",sans-serif;
      cursor:pointer;
      text-shadow:0 0 12px var(--lyric-primary);
      -webkit-app-region:no-drag;
    }
    .lyrics-close:hover{color:#fff}
    body.unlocked .lyrics-close{display:flex}
    body.unlocked .stage.hint-visible .lock-hint{pointer-events:auto;-webkit-app-region:no-drag}
    .stage.hint-visible .lock-hint{opacity:.94;transform:translateX(-50%) translateY(0) scale(1)}
    /* 悬停播放控制条：酷狗式桌面歌词行为。跟随 hint-visible 显隐，锁定时不出现
       （锁定态窗口鼠标穿透，本来就点不到按钮）。 */
    .lyrics-controls{
      display:none;
      align-items:center;
      gap:1px;
      margin-left:1px;
      padding-left:7px;
      border-left:1px solid rgba(255,255,255,.16);
      -webkit-app-region:no-drag;
    }
    body.unlocked .stage.hint-visible .lyrics-controls{display:flex;pointer-events:auto}
    .lyrics-control-btn{
      display:flex;
      align-items:center;
      justify-content:center;
      width:24px;
      height:22px;
      padding:0;
      border:0;
      border-radius:7px;
      background:transparent;
      color:rgba(255,255,255,.82);
      cursor:pointer;
      -webkit-app-region:no-drag;
      transition:background .16s ease,color .16s ease;
    }
    .lyrics-control-btn:hover{background:rgba(255,255,255,.14);color:#fff}
    .lyrics-control-btn:active{background:rgba(255,255,255,.22)}
    .lyrics-control-btn svg{width:13px;height:13px;fill:currentColor;pointer-events:none}
    .lyrics-control-btn .icon-pause{display:none}
    body:not(.paused) .lyrics-control-btn .icon-pause{display:block}
    body:not(.paused) .lyrics-control-btn .icon-play{display:none}
    @keyframes lyr-in{
      0%{opacity:0;transform:translate3d(0,32px,-120px) rotateX(24deg) rotateY(-18deg) scale(.78);filter:blur(12px)}
      58%{opacity:1;filter:blur(0)}
      100%{opacity:1;transform:translate3d(0,0,0) rotateX(0deg) rotateY(0deg) scale(1);filter:blur(0)}
    }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div class="wrap">
    <div id="stage" class="stage">
      <div id="lyricViewport" class="lyric-viewport"><div id="lyricScroller" class="lyric-scroll"><div id="line" class="line" data-text="Mineradio">Mineradio</div><div id="lineNext" class="line line-next" data-text=""></div></div><div id="lineStack" class="lyric-stack" aria-hidden="true"></div></div>
      <div id="lockHint" class="lock-hint"><svg class="lock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d=""></path></svg><span id="lockText">&#20013;&#38190;&#35299;&#38145;</span><div id="lyricsControls" class="lyrics-controls">
        <button id="desktopLyricsPrevBtn" class="lyrics-control-btn" type="button" data-playback-action="prevTrack" aria-label="&#19978;&#19968;&#39318;" title="&#19978;&#19968;&#39318;"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2h2.4v20H4zM20 2v20L8.6 12z"/></svg></button>
        <button id="desktopLyricsPlayBtn" class="lyrics-control-btn" type="button" data-playback-action="togglePlay" aria-label="&#25773;&#25918; / &#26242;&#20572;" title="&#25773;&#25918; / &#26242;&#20572;"><svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2l13 10L5 22z"/></svg><svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2h5v20H4zM15 2h5v20h-5z"/></svg></button>
        <button id="desktopLyricsNextBtn" class="lyrics-control-btn" type="button" data-playback-action="nextTrack" aria-label="&#19979;&#19968;&#39318;" title="&#19979;&#19968;&#39318;"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.6 2H20v20h-2.4zM4 2l11.4 10L4 22z"/></svg></button>
      </div><button id="closeLyricsBtn" class="lyrics-close" type="button" aria-label="Close desktop lyrics">&#20851;&#38381;&#26700;&#38754;&#27468;&#35789;</button></div>
    </div>
  </div>
  <script src="vendor/morphicons/morphicons.global.js"></script>
  <script>
    'use strict';
    var canvas = document.getElementById('fx');
    var ctx = canvas.getContext('2d');
    var stage = document.getElementById('stage');
    var lyricViewport = document.getElementById('lyricViewport');
    var line = document.getElementById('line');
    var lineNext = document.getElementById('lineNext');
    var lineStack = document.getElementById('lineStack');
    var stackRows = [];
    var stackActiveIdx = -1;
    var stackSignature = '';
    // 窗口正中那行的进度，用来兜住「连续两句歌词一模一样」时文本签名不变的情况
    var stackActiveProgress = 0;
    var lockHint = document.getElementById('lockHint');
    var lockText = document.getElementById('lockText');
    var closeLyricsBtn = document.getElementById('closeLyricsBtn');
    var lyricsControls = document.getElementById('lyricsControls');
    var dpr = 1;
    var lastText = '';
    var lastNextText = '';
    var progressText = '';
    var displayedProgress = 0;
    var baseFontSize = 58;
    var renderedFontSize = 58;
    var fitScaleX = 1;
    var hoverCapture = false;
    var dragging = false;
    var dragPointerId = null;
    var dragLast = { x:0, y:0 };
    // 最近一次真正挪动窗口的时间：窗口被 setBounds 移动后，Chromium 会补发一串
    // buttons=0 的合成 move，用它区分「合成事件」和「用户真的松手了」
    var dragMovedAt = 0;
    var lastDrawAt = 0;
    var layoutKey = '';
    var hoverInside = false;
    var hintVisible = false;
    var hintTimer = 0;
    var lastPointerEvent = null;
    var scrollState = { needed:false, overflow:0, limit:0, offset:0, dir:-1, holdUntil:0, lastAt:0 };
    var particles = [];

      g.addColorStop(0.28, colorWithAlpha(state.displayColors.glow, .15));
      g.addColorStop(0.64, colorWithAlpha(state.displayColors.secondary, .040));
      g.addColorStop(0.90, colorWithAlpha(state.displayColors.glow, .006));
      g.addColorStop(1.00, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0,0,1,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
    function drawHighlightBloom(rect, progress) {
      if (!state.lyricGlow || state.highlightFollow !== true) return;
      var p = clamp(progress, 0, 1, 0);
      var x = rect.left + rect.width * p;
      var y = rect.top + rect.height * .50 - live.lift * .10;
      var rx = Math.max(42, Math.min(150, renderedFontSize * (1.05 + live.beat * .32)));
      var ry = Math.max(24, Math.min(82, renderedFontSize * (.42 + live.beat * .18)));
      var alpha = clamp(.18 + live.solar * .12 + live.beat * .18, .12, .48) * clamp(state.opacity, .28, 1, .92);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      ctx.scale(rx, ry);
      var g = ctx.createRadialGradient(0,0,0,0,0,1);
      g.addColorStop(0, colorWithAlpha(state.displayColors.highlight, .88));
      g.addColorStop(.36, colorWithAlpha(state.displayColors.glow, .34));
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0,0,1,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
    function drawGlowText(rect, motion) {
      if (!state.lyricGlow || motion.glowStrength <= 0) return;
      var target = Math.min(1.08, (0.09 + live.solar * .38 + live.beat * .22) * Math.min(3, motion.glowDrive));
      live.glow += (target - live.glow) * (target > live.glow ? .11 : .06);
      if (live.glow <= .004) return;
      var text = line.textContent || 'Mineradio';
      var cx = rect.left + rect.width / 2;
      var cy = rect.top + rect.height / 2;
      var spacing = renderedFontSize * state.letterSpacing;
      var hotMix = Math.max(0, Math.min(1, live.solar * 1.05 + live.beat * .18));
      var color = hotMix > .42 ? state.displayColors.highlight : state.displayColors.glow;
      var layers = [
        { blur:10, alpha:.54, stroke:Math.max(9, renderedFontSize * .09) },
        { blur:24, alpha:.38, stroke:Math.max(15, renderedFontSize * .15) },
        { blur:48, alpha:.20, stroke:Math.max(22, renderedFontSize * .22) },
        { blur:78, alpha:.09, stroke:Math.max(30, renderedFontSize * .30) }
      ];
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = state.fontWeight + ' ' + renderedFontSize + 'px ' + state.fontFamily;
      ctx.translate(cx, cy);
      ctx.scale(fitScaleX * live.scale, live.scale);
      for (var i = 0; i < layers.length; i++) {
        ctx.save();
        ctx.filter = 'blur(' + layers[i].blur + 'px)';
        ctx.globalAlpha = live.glow * layers[i].alpha * clamp(state.opacity, .28, 1, .92);
        ctx.fillStyle = color;
        ctx.strokeStyle = color;
        ctx.lineWidth = layers[i].stroke;
        ctx.lineJoin = 'round';
        drawCanvasText(text, 0, 0, renderedFontSize, spacing, true);
        drawCanvasText(text, 0, 0, renderedFontSize, spacing, false);
        ctx.restore();
      }
      ctx.restore();
    }
    function drawParticles(rect, motion, now) {
      var target = state.lyricGlow && state.lyricGlowParticles ? Math.min(.50, (.12 + live.solar * .18 + live.beat * .16) * Math.min(1.7, motion.glowDrive)) : 0;
      live.spark += (target - live.spark) * (target > live.spark ? .14 : .08);
      if (live.spark <= .006) return;
      ensureParticles();
      var width = Math.max(300, Math.min(innerWidth - 48, rect.width * 1.16 + 140));
      var height = Math.max(74, rect.height * 1.34);
      var cx = rect.left + rect.width / 2;
      var cy = rect.top + rect.height / 2 + Math.sin(now * .55) * 3.5;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (var i=0;i<particles.length;i++) {
        var p = particles[i];
        var lane = Math.floor(p.lane * 5);
        var local = (p.lane * 5) % 1;
        var speed = .018 + rand(p.seed) * .030 + lane * .002;
        var flow = (p.phase + now * speed) % 1;
        var edge = Math.sin(Math.PI * flow);
        var x = cx + (flow - .5) * width * (1.02 + rand(p.seed * 4.1) * .18);
        var curve = Math.sin(flow * Math.PI * 2 * (.9 + rand(p.seed * 1.3) * .5) + p.seed + now * .32);
        var y = cy + (lane - 2) * height * .13 + curve * height * (.16 + rand(p.seed * 2.2) * .18) + (local - .5) * height * .13 + Math.sin(now * (.42 + rand(p.seed) * .32) + p.seed) * (4 + live.beat * 6);
        var tw = Math.pow(.5 + .5 * Math.sin(now * (.7 + rand(p.seed) * .4) + p.seed), 4);
        var r = Math.max(.7, p.size * (.75 + edge * 1.45 + tw * .85 + live.beat * .55));
        var grad = ctx.createRadialGradient(x,y,0,x,y,r*4.5);
        grad.addColorStop(0, colorWithAlpha(state.displayColors.highlight, .96));
        grad.addColorStop(.34, colorWithAlpha(state.displayColors.glow, .68));
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalAlpha = live.spark * (0.16 + edge * .44 + tw * .24) * clamp(state.opacity, .28, 1, .92);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x,y,r*4.5,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    function draw(nowMs){
      if (state.enabled) {
        var interval = frameIntervalMs();
        if (interval > 0 && lastDrawAt && nowMs - lastDrawAt < Math.max(4, interval - 1.25)) {
          scheduleNextDraw();
          return;
        }
      }
      var dt = lastDrawAt ? Math.min(.12, Math.max(.001, (nowMs - lastDrawAt) / 1000)) : 1 / 60;
      lastDrawAt = nowMs;
      var now = nowMs * .001;
      if (state.enabled) {
        var progress = currentDisplayProgress();
        setRootVar('--lyric-progress', (progress * 100).toFixed(2) + '%');
        updateStackProgress(progress);
        var offlineMotion = tickDesktopBeatMap(currentDesktopPlaybackTime(nowMs), dt);
        var motion = updateMotion(now, offlineMotion);
        applyStageMotion(now);
        updateLyricScroll(nowMs, progress);
      }
      scheduleNextDraw();
    }
    function scheduleNextDraw() {
      if (!state.enabled) {
        setTimeout(function(){ requestAnimationFrame(draw); }, 250);
        return;
      }
      requestAnimationFrame(draw);
    }
    function normalizeFrameRate(value) {
      var n = Number(value);
      if (!isFinite(n) || n <= 0) return 0;
      if (n <= 26) return 24;
      if (n <= 45) return 30;
      if (n <= 90) return 60;
      return 120;
    }
    function frameIntervalMs() {
      var fps = normalizeFrameRate(state.frameRate);
      return fps > 0 ? 1000 / fps : 0;
    }
    function pointInRect(evt, rect, padX, padY) {
      return evt.clientX >= rect.left - padX && evt.clientX <= rect.right + padX && evt.clientY >= rect.top - padY && evt.clientY <= rect.bottom + padY;
    }
    function pointInStage(evt) {
      if (!state.enabled || !evt) return false;
      if (dragging) return true;
      if (!isLocked()) {
        var stageRect = stage.getBoundingClientRect();
        return pointInRect(evt, stageRect, 0, 0);
      }
      var padX = Math.max(24, Math.min(68, innerWidth * .034));
      var padY = Math.max(22, Math.min(46, innerHeight * .045));
      var lyricRect = lyricViewport.getBoundingClientRect();
      if (pointInRect(evt, lyricRect, padX, padY)) return true;
      var hintRect = lockHint.getBoundingClientRect();
      return pointInRect(evt, hintRect, 10, 10);
    }
    function setHintVisible(visible) {
      hintVisible = !!visible;
      stage.classList.toggle('hint-visible', hintVisible);
      setPointerCapture(!isLocked() && (hintVisible || dragging) && hoverInside);
    }
    function hideInteractionHint() {
      hoverInside = false;
      lastPointerEvent = null;
      if (hintTimer) {
        clearTimeout(hintTimer);
        hintTimer = 0;
      }
      setHintVisible(false);
      stage.classList.remove('hover');
    }
    function scheduleInteractionHint() {
      if (hintVisible || hintTimer) return;
      hintTimer = setTimeout(function(){
        hintTimer = 0;
        if (!hoverInside || !lastPointerEvent || !pointInStage(lastPointerEvent)) return;
        setHintVisible(true);
      }, 1500);
    }
    function updateHover(evt) {
      var inside = !!state.enabled && pointInStage(evt);
      hoverInside = inside;
      lastPointerEvent = evt || lastPointerEvent;
      stage.classList.toggle('hover', inside || dragging);
      if (isLocked()) {
        if (inside || dragging) {
          scheduleInteractionHint();
        } else {
          hideInteractionHint();
        }
        setPointerCapture(false);
        return inside;
      }
      if (inside || dragging) {
        scheduleInteractionHint();
      } else {
        hideInteractionHint();
      }
      setPointerCapture(inside || dragging);
      return inside;
    }
    function setLocked(locked) {
      state.clickThrough = !!locked;
      syncLockClasses();
      if (window.desktopOverlay && window.desktopOverlay.setLyricsLockState) {
        window.desktopOverlay.setLyricsLockState(!!locked).catch(function(){});
      }
    }
    function moveDrag(evt) {
      if (dragging && !isLocked() && window.desktopOverlay && window.desktopOverlay.moveLyricsBy) {
        var dx = evt.screenX - dragLast.x;
        var dy = evt.screenY - dragLast.y;
        dragLast.x = evt.screenX;
        dragLast.y = evt.screenY;
        if (dx || dy) {
          dragMovedAt = performance.now();
          window.desktopOverlay.moveLyricsBy(dx, dy).catch(function(){});
        }
      }
    }
    function endDrag(evt) {
      if (!dragging) return;
      if (evt && dragPointerId != null && evt.pointerId != null && evt.pointerId !== dragPointerId) return;
      try {
        if (dragPointerId != null && stage.releasePointerCapture && stage.hasPointerCapture && stage.hasPointerCapture(dragPointerId)) {
          stage.releasePointerCapture(dragPointerId);
        }
      } catch (e) {}
      dragging = false;
      dragPointerId = null;
      setPointerCapture(false);
    }
    /* buttons=0 通常意味着「在窗口外松手了」，但窗口被拖动（setBounds）之后
     * Chromium 会补发一串 buttons=0 的合成 move。刚挪过窗口的这段时间里不能判松手，
     * 否则一次拖动只走一步就被打断（用户看到的「拖一下就断」）。 */
    function shouldCancelDrag(evt, nowMs) {
      if (!dragging) return false;
      if (!evt || evt.buttons == null) return false;
      if ((evt.buttons & 1) !== 0) return false;
      return (nowMs - dragMovedAt) > 260;
    }
    window.addEventListener('pointermove', function(evt){
      if (shouldCancelDrag(evt, performance.now())) {
        endDrag(evt);
        updateHover(evt);
        return;
      }
      updateHover(evt);
      moveDrag(evt);
    });
    window.addEventListener('mousemove', function(evt){
      if (!dragging) updateHover(evt);
    });
    window.addEventListener('pointerleave', function(){
      if (dragging) {
        setPointerCapture(true);
        return;
      }
      hideInteractionHint();
    });
    window.addEventListener('mouseleave', function(){
      if (!dragging) hideInteractionHint();
    });
    window.addEventListener('pointerdown', function(evt){
      if (!pointInStage(evt)) return;
      if (isControlTarget(evt.target)) return;
      if (evt.button === 1) {
        evt.preventDefault();
        hideInteractionHint();
        return;
      }
      if (isLocked()) {
        hideInteractionHint();
        setPointerCapture(false);
        return;
      }
      if (evt.button === 0 && !isLocked()) {
        dragging = true;
        dragPointerId = evt.pointerId;
        dragLast.x = evt.screenX;
        dragLast.y = evt.screenY;
        dragMovedAt = performance.now();
        setPointerCapture(true);
        try {
          if (stage.setPointerCapture) stage.setPointerCapture(evt.pointerId);
        } catch (e) {}
        evt.preventDefault();
      }
    });
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
    window.addEventListener('blur', function(){
      endDrag({ pointerId:dragPointerId });
      hideInteractionHint();
    });
    stage.addEventListener('lostpointercapture', endDrag);
    window.addEventListener('auxclick', function(evt){
      if (evt.button === 1 && pointInStage(evt)) evt.preventDefault();
    });
    if (closeLyricsBtn) {
      closeLyricsBtn.addEventListener('click', function(evt){
        evt.preventDefault();
        evt.stopPropagation();
        state.enabled = false;
        document.body.classList.remove('show');
        setPointerCapture(false);
        if (window.desktopOverlay && window.desktopOverlay.closeLyrics) {
          window.desktopOverlay.closeLyrics().catch(function(){});
        }
      });
    }
    if (lyricsControls) {
      lyricsControls.addEventListener('click', function(evt){
        var btn = evt.target && evt.target.closest
          ? evt.target.closest('button[data-playback-action]') : null;
        if (!btn || !lyricsControls.contains(btn)) return;
        evt.preventDefault();
        evt.stopPropagation();
        sendPlaybackAction(btn.getAttribute('data-playback-action'));
      });
    }
    window.__mineradioDesktopLyricsApplyState = applyState;
    window.__mineradioDesktopLyricsSendPlaybackAction = sendPlaybackAction;
    window.addEventListener('message', function(event){
      var data = event && event.data;
      if (!data || data.type !== 'mineradio-desktop-lyrics-state') return;
      applyState(data.payload || {});
    });
    window.addEventListener('resize', resize);
    resize();
    (function applyQueryState(){
      try {
        var raw = new URLSearchParams(window.location.search).get('state');
        if (raw) applyState(JSON.parse(raw));
      } catch (e) {}
    })();
    if (window.desktopOverlay && window.desktopOverlay.onLyricsState) {
      window.desktopOverlay.onLyricsState(applyState);
    }
    requestAnimationFrame(draw);
  </script>
</body>
</html>
